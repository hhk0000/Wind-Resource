name: Publish GUI branch
on:
  push:
    branches: [main]
    paths: ['gui/**', '.github/workflows/publish-gui.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gui-publish
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Publish GUI only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gui_tree=$(git rev-parse HEAD:gui)
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            parent=$(git rev-parse refs/remotes/origin/gh-pages)
            current_tree=$(git rev-parse "$parent^{tree}")
            if [ "$gui_tree" = "$current_tree" ]; then
              echo "GUI already published to branch"
              exit 0
            fi
            release=$(git commit-tree "$gui_tree" -p "$parent" -m "Publish GUI from $GITHUB_SHA")
          else
            release=$(git commit-tree "$gui_tree" -m "Publish GUI from $GITHUB_SHA")
          fi
          git push origin "$release:refs/heads/gh-pages"
